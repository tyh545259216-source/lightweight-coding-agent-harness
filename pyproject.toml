[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "mini-harness"
version = "0.1.0"
description = "Lightweight Coding Agent Harness: independently implemented Agent Runtime"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3", "httpx>=0.27,<1", "jsonschema>=4.23,<5"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=5,<8", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-jsonschema"]
[project.scripts]
mini-harness = "mini_harness.cli:main"
harness-eval = "mini_harness.evaluation.evaluator:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
[tool.mypy]
python_version = "3.12"
strict = true
